      <h1>Family Chat</h1>
      <p>Семейный чат, где сервером служит папка WebDAV на домашнем роутере. Сайт появится на этапе M6.</p>
      <p>Исходный код: <a href="https://github.com/stepin/family-chat">github.com/stepin/family-chat</a>.</p>
      <p>Зонд совместимости работает на адресе клиента: откройте <code>/probe/</code> там, где опубликован клиент.</p>
    </main>
  </body>
