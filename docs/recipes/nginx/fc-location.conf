# Reverse proxy that adds CORS to a WebDAV server without it
# (docs/PLAN.md 5, 6.11, 6.12). Include it inside a `server` block that
# defines `$fc_cors_origin` (map) and the `fc_webdav` upstream; see
# family-chat.conf.
#
# Paths are passed unchanged, there are no redirects, Date comes from the
# WebDAV server, and OPTIONS is answered here without authentication.

location / {
    if ($request_method = OPTIONS) {
        include family-chat/fc-cors-headers.conf;
        return 204;
    }
    include family-chat/fc-cors-headers.conf;

    proxy_pass http://fc_webdav;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_pass_header Date;

    # The values above win over whatever the WebDAV server sends.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Vary;

    # Large attachments go through as a stream.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
