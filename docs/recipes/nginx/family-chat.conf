# family-chat: HTTPS proxy with CORS in front of the router's WebDAV.
# Put this file into /etc/nginx/conf.d/ and the two fc-*.conf files into
# /etc/nginx/family-chat/. Replace the three marked values.

# 1. The exact origin of the family-chat client (scheme, host, port; no path).
map $http_origin $fc_cors_origin {
    default "";
    "https://chat.example.net" $http_origin;
}

# 2. The router's WebDAV. If it only speaks HTTPS, change `http://fc_webdav`
#    in fc-location.conf to `https://fc_webdav`.
upstream fc_webdav {
    server 192.168.1.1:5080;
    keepalive 8;
}

server {
    listen 443 ssl;
    http2 on;
    # 3. The public name of this proxy and its certificate (e.g. Let's Encrypt).
    server_name dav.example.net;
    ssl_certificate     /etc/letsencrypt/live/dav.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dav.example.net/privkey.pem;

    include family-chat/fc-location.conf;
}
