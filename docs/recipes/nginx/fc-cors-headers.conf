# CORS and safety headers for the family-chat WebDAV (docs/PLAN.md 5 and 6.12).
# Included by fc-location.conf; do not include it on its own.
#
# `always` adds the headers to error responses too (401, 404, 405, 409, 507):
# without them the browser sees an error as a network failure (6.11).
add_header Access-Control-Allow-Origin   $fc_cors_origin always;
add_header Vary                          Origin always;
add_header Access-Control-Allow-Methods  "GET, PUT, DELETE, MKCOL, PROPFIND, OPTIONS" always;
add_header Access-Control-Allow-Headers  "Authorization, Depth, Content-Type" always;
# Date: clock offset. The rest only lets the probe verify this configuration.
add_header Access-Control-Expose-Headers "Date, Access-Control-Max-Age, Content-Security-Policy, X-Content-Type-Options" always;
add_header Access-Control-Max-Age        7200 always;
add_header Cache-Control                 "no-store" always;
# An .html uploaded by a member must not become a page under the family address.
add_header X-Content-Type-Options        nosniff always;
add_header Content-Security-Policy       sandbox always;
