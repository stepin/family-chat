name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start WebDAV servers (tools/dav-dev)
        run: pnpm dav:up
      - run: pnpm test:integration
      - run: pnpm --filter @family-chat/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - name: Server logs
        if: failure()
        run: pnpm --filter @family-chat/dav-dev run logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: pnpm install --frozen-lockfile
      # fcd embeds apps/web/dist, so the client is built first.
      - run: pnpm --filter @family-chat/web run build
      - run: cargo fmt --check
        working-directory: server
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: server
      - run: cargo test --locked
        working-directory: server
      - run: cargo build --locked
        working-directory: server
      - run: pnpm --filter @family-chat/web exec playwright install --with-deps chromium
      - name: End-to-end test against fcd
        run: pnpm test:e2e:fcd
        env:
          FCD_BIN: ${{ github.workspace }}/server/target/debug/fcd
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-fcd
          path: apps/web/playwright-report-fcd
          retention-days: 7
