name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The server, then everything that runs against a built fcd: the core
  # integration tests, the chat end-to-end tests and the server check page.
  server-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: pnpm install --frozen-lockfile
      # fcd embeds apps/web/dist, so the client is built first.
      - run: pnpm --filter @family-chat/web run build
      - run: cargo fmt --check
        working-directory: server
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: server
      - run: cargo test --locked
        working-directory: server
      - run: cargo build --locked
        working-directory: server
      - name: Core integration tests against fcd
        run: pnpm test:integration
        env:
          FCD_BIN: ${{ github.workspace }}/server/target/debug/fcd
      - run: pnpm --filter @family-chat/web exec playwright install --with-deps chromium
      - name: Chat end-to-end tests against fcd
        run: pnpm test:e2e
        env:
          FCD_BIN: ${{ github.workspace }}/server/target/debug/fcd
      - name: Server check page against fcd
        run: pnpm test:e2e:fcd
        env:
          FCD_BIN: ${{ github.workspace }}/server/target/debug/fcd
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-reports
          path: |
            apps/web/playwright-report
            apps/web/playwright-report-fcd
          retention-days: 7
