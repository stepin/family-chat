name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The placeholders of the time before publication must not come back
      # (compose.yaml, deploy/, docs/). git grep exits 1 when nothing is found,
      # 0 on a hit, 2 on an error; `! git grep` would turn an error into success.
      # -E: the basic syntax of git on macOS does not understand \|.
      - name: No placeholder addresses
        run: |
          set +e
          git grep -nE 'code\.example\.org|registry\.example\.org|TO BE FILLED' -- . \
            ':!apps/site/check.mjs' ':!apps/site/test/' ':!.github/workflows/ci.yml'
          rc=$?
          set -e
          [ "$rc" -eq 1 ]
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The server, then everything that runs against a built fcd: the core
  # integration tests, the chat end-to-end tests and the server check page.
  server-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: pnpm install --frozen-lockfile
      # fcd embeds apps/web/dist, so the client is built first.
      - run: pnpm --filter @family-chat/web run build
      - run: cargo fmt --check
        working-directory: server
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: server
      - run: cargo test --locked
        working-directory: server
      - run: cargo build --locked
        working-directory: server
      - name: Core integration tests against fcd
        run: pnpm test:integration
        env:
          FCD_BIN: ${{ github.workspace }}/server/target/debug/fcd
      - run: pnpm --filter @family-chat/web exec playwright install --with-deps chromium
      - name: Chat end-to-end tests against fcd
        run: pnpm test:e2e
        env:
          FCD_BIN: ${{ github.workspace }}/server/target/debug/fcd
      - name: Server check page against fcd
        run: pnpm test:e2e:fcd
        env:
          FCD_BIN: ${{ github.workspace }}/server/target/debug/fcd
      - name: Site in the browser (axe, keyboard, 360 px, the menu, no app)
        run: pnpm test:e2e:site
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-reports
          path: |
            apps/web/playwright-report
            apps/web/playwright-report-fcd
            apps/site/playwright-report-site
          retention-days: 7

  # Windows code paths of the server (free disk space, console signals, no
  # Unix permissions). Lint and unit tests must pass. The integration tests
  # (real processes, files, sockets) have not yet been confirmed on a Windows
  # machine, so for now their result is reported without failing the run.
  server-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @family-chat/web run build
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: server
      - run: cargo test --locked --lib --bins
        working-directory: server
      - name: Integration tests (not yet confirmed on Windows)
        run: cargo test --locked --tests
        working-directory: server
        continue-on-error: true
