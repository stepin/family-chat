name: Site

# Builds the static site (apps/site, with the web client under app/) and keeps
# it as an artefact. The Pages deployment runs only on the default branch and
# only after publication, when the repository variable PAGES_ENABLED is "true"
# (docs/RELEASING.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publication values from this repository
        env:
          BASE_PATH_VAR: ${{ vars.SITE_BASE_PATH }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "SITE_REPOSITORY_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "SITE_IMAGE=ghcr.io/$owner/fcd"
            echo "SITE_BASE_PATH=${BASE_PATH_VAR:-/${GITHUB_REPOSITORY#*/}/}"
          } >> "$GITHUB_ENV"
      - run: pnpm --filter "@family-chat/web..." run build
        env:
          FCD_GIT_COMMIT: ${{ github.sha }}
      - run: pnpm --filter @family-chat/site run build
      - run: node apps/site/check.mjs apps/site/dist
      - run: pnpm --filter @family-chat/site exec playwright install --with-deps chromium
      - run: pnpm test:e2e:site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/site/dist
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: apps/site/dist

  deploy:
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
