# WebDAV servers for development and tests (docs/PLAN.md 10).
#   18080  Apache mod_dav without CORS (a router's built-in WebDAV)
#   18081  dufs with --enable-cors
#   18082  nginx recipe (docs/recipes/nginx) in front of 18080's server
#   18083  Caddy recipe (docs/recipes/caddy) in front of 18080's server
# Account everywhere: fc / secret; chat folder: /family-chat/.
name: family-chat-dav-dev

x-client-origin: &client-origin ${FC_CLIENT_ORIGIN:-http://localhost:4173}

services:
  nocors:
    build: ./apache
    image: family-chat-dav-dev/apache:local
    command: ["sh", "/dav/start.sh"]
    volumes:
      - ./apache:/dav:ro
      - nocors-data:/data
    ports:
      - "127.0.0.1:18080:80"

  dufs-init:
    image: httpd:2.4-alpine
    command: ["sh", "-c", "mkdir -p /data/family-chat /data/other && echo private > /data/other/readme.txt"]
    volumes:
      - dufs-data:/data

  dufs:
    image: sigoden/dufs:v0.47.0
    command: ["/data", "--enable-cors", "--auth", "fc:secret@/family-chat:rw", "--port", "5000", "--allow-upload", "--allow-delete"]
    volumes:
      - dufs-data:/data
    depends_on:
      dufs-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18081:5000"

  nginx-proxy:
    image: nginx:1.27-alpine
    environment:
      FC_CLIENT_ORIGIN: *client-origin
    volumes:
      - ../../docs/recipes/nginx:/etc/nginx/family-chat:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on: [nocors]
    ports:
      - "127.0.0.1:18082:80"

  caddy-proxy:
    image: caddy:2-alpine
    environment:
      FC_SITE_ADDRESS: ":80"
      FC_CLIENT_ORIGIN: *client-origin
      FC_WEBDAV_UPSTREAM: "nocors:80"
    volumes:
      - ../../docs/recipes/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [nocors]
    ports:
      - "127.0.0.1:18083:80"

volumes:
  nocors-data:
  dufs-data:
